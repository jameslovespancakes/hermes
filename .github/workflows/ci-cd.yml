name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7          # no LFS: unit tests use synthetic data
      - uses: astral-sh/setup-uv@v10.3.0   # this action publishes exact tags only
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check server experiments
      - name: Unit tests (server)
        run: uv run python -m unittest discover -s server/tests -t . -v
      - name: Unit tests (bad-data simulators)
        run: uv run python -m unittest discover -s experiments/tests -t . -v

  docker:
    name: Build and smoke-test image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hermes-eta:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: docker run -d --name eta -p 8000:8000 hermes-eta:ci
      - name: Smoke test API
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | python3 -c "import json,sys; h=json.load(sys.stdin); assert h['status']=='ok' and h['records']>0, h"
          curl -sf localhost:8000/model | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['test_overall']['mae']>0, m"
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"courier_id": "2136", "at": "09-20 10:30:00"}' \
            | python3 -c "import json,sys; p=json.load(sys.stdin)['packages']; assert len(p)>0 and all(x['minutes_remaining']>=0 for x in p), p; print(f'{len(p)} packages predicted')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict -H 'Content-Type: application/json' -d '{"courier_id": "1", "at": "bad"}')" = "422"
      - name: Container logs
        if: always()
        run: docker logs eta

  publish:
    name: Publish image to GHCR
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
