name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.1"
      - run: uv sync --frozen
      - run: uv run ruff check server evidence
      - run: uv run python -m unittest discover -s server/tests -t .
      - run: uv run python -m unittest discover -s evidence -t .
