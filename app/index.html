<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffeb" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Hermes</title>
    <style>
      /* Paint cream from the first frame and cross-fade between pages instead of flashing white. */
      html {
        background: #ffffeb;
      }
      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.2s;
      }
      /* Research pages stay hidden until their first scroll pose is drawn. */
      html[data-boot] #main,
      html[data-boot] #main *,
      html[data-boot] .photo-flight {
        visibility: hidden !important;
      }
    </style>
    <script>
      if (/^\/(benchmarks|methodology)\/?$/.test(location.pathname))
        document.documentElement.dataset.boot = '';
    </script>
    <!-- Pages are prerendered while a nav link is hovered, so the swap is instant. -->
    <script type="speculationrules">
      { "prerender": [{ "where": { "href_matches": "/*" }, "eagerness": "moderate" }] }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
